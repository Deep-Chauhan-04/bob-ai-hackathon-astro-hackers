submission:
  title: "Threat Intelligence Correlation & Alert Prioritisation Assistant"

  problem_statement: >
    Security Operations Centres (SOCs) are overwhelmed by hundreds of thousands
    of raw SIEM alerts daily, making it nearly impossible for analysts and
    commanders to identify genuine threats amid noise and false positives.
    Adversary tactics remain unmapped to actionable intelligence frameworks,
    and decision-makers lack concise, prioritised briefings to act decisively.

  solution_summary: >
    An end-to-end AI-powered SOC platform that ingests 244 k+ Zeek and
    CIC-IDS2018 network/IDS events, correlates them into multi-stage attack
    campaigns, enriches indicators against the live Abuse.ch URLhaus IOC feed
    and the MITRE ATT&CK STIX 2.1 framework, and applies a RandomForest ML
    classifier to separate genuine threats from false positives—producing
    structured BLUF (Bottom Line Up Front) executive briefs and an interactive
    Streamlit Command Centre dashboard for commanders and SOC analysts.

  key_features:
    - "Multi-source SIEM ingestion (244k+ Zeek + CIC-IDS2018 events) with alert deduplication achieving >73% noise reduction"
    - "Live Abuse.ch URLhaus IOC cross-correlation with offline-resilient JSON cache for guaranteed demo availability"
    - "MITRE ATT&CK STIX 2.1 technique enrichment covering T1110, T1190, T1498, T1499, T1071, T1595, T1078, T1048"
    - "RandomForest ML classifier (AUC-ROC ~0.99) distinguishing genuine threats from false positives with confidence scores"
    - "Automated defence-grade BLUF commander briefs with dynamic Priority Score = Threat_Confidence × Asset_Criticality × Severity"

  tech_stack:
    languages: ["Python 3.10+"]
    frameworks: ["Streamlit", "scikit-learn", "Plotly", "pandas", "NumPy"]
    ibm_technologies: ["IBM Bob"]
    databases: []
    other: ["Abuse.ch URLhaus API", "MITRE ATT&CK STIX 2.1 (GitHub CDN)", "RandomForest Classifier", "Zeek IDS", "CIC-IDS2018 Dataset"]

  what_we_are_most_proud_of: >
    The automated BLUF (Bottom Line Up Front) generator that combines ML
    threat confidence, MITRE ATT&CK technique enrichment, URLhaus IOC
    cross-correlation, and multi-stage incident correlation into a single
    military-grade structured intelligence brief. A commander can read the
    bottom line in under 10 seconds and immediately issue containment orders
    with cited evidence — closing the gap between raw telemetry and
    actionable command decision-making.

  known_limitations: >
    The URLhaus IOC cross-correlation shows limited direct IP hits on the
    current dataset IPs because URLhaus primarily tracks malware-hosting URLs
    rather than DDoS/brute-force source IPs. Incident temporal clustering uses
    a fixed 5-minute window which may merge or split some campaigns. The ML
    classifier is trained on the same dataset distribution and should be
    re-validated against out-of-distribution production traffic before
    operational deployment.

